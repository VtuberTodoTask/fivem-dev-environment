services:
  fivem:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIVEM_VERSION: "${FIVEM_VERSION:-29586-3284e7bf7ac848fcf3ccd51432279fdc3a76245b}"
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # FiveM ゲームポート
      - "${FIVEM_PORT:-30120}:30120"
      - "${FIVEM_PORT:-30120}:30120/udp"
      # txAdmin Web UI ポート
      - "${TXADMIN_PORT:-40120}:40120"
    volumes:
      # FiveM サーバー設定
      - ./server-data:/config
      # txAdmin データ
      - ./txData:/txData
      # リソースフォルダ（entrypoint.shでシンボリックリンク作成）
      - ./resources:/resources:ro
    environment:
      NO_DEFAULT_CONFIG: "1"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    networks:
      - fivem-network

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # 初期化SQLスクリプト（初回起動時のみ実行）
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-fivem_root_pass}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-fivem}"
      MYSQL_USER: "${MYSQL_USER:-fivem}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-fivem_pass}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fivem-network

volumes:
  mariadb_data:

networks:
  fivem-network:
    driver: bridge
